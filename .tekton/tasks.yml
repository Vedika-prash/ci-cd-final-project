
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -eu
        echo "Cleanup task started"
        find "$(workspaces.source.path)" \
          -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        echo "Cleanup task completed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nose
        nosetests -v
